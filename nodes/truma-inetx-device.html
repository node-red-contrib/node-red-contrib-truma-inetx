<script type="text/javascript">
  RED.nodes.registerType('truma-inetx-device', {
    category: 'config',
    defaults: {
      name: { value: '' },
      bluetooth: { value: 'auto' },
      adapter: { value: '' },
      timeZone: { value: '', validate: function (value) { try { if (value) new Intl.DateTimeFormat('en', { timeZone: value.trim() }); return true; } catch (_) { return false; } } },
      targetMode: { value: 'first' },
      deviceName: { value: '' },
      deviceAddress: { value: '' }
    },
    label: function () {
      return this.name || this.deviceName || this.deviceAddress || 'Truma iNet X';
    },
    oneditsave: function () {
      if ($('#node-config-input-bluetooth').val() === 'noble') $('#node-config-input-adapter').val('');
    },
    oneditprepare: function () {
      var nodeId = this.id;
      var deviceSelect = $('#node-config-input-deviceSelect');
      var targetMode = $('#node-config-input-targetMode');
      var deviceName = $('#node-config-input-deviceName');
      var deviceAddress = $('#node-config-input-deviceAddress');
      var searchButton = $('#node-config-input-search');
      var searchStatus = $('#node-config-input-search-status');
      var refreshButton = $('#node-config-input-refresh-tree');
      var refreshStatus = $('#node-config-input-refresh-tree-status');
      var devices = [];
      var searched = false;

      function deviceValue(name, address) {
        return JSON.stringify({ name: name || '', address: address || '' });
      }

      function deviceLabel(device) {
        var name = device.name || '<unnamed>';
        var address = device.address || device.id || 'unknown address';
        var paired = device.paired === true ? 'paired on host' : device.paired === false ? 'not paired' : 'pairing unknown';
        var rssi = typeof device.rssi === 'number' ? ', rssi ' + device.rssi : '';
        return name + ' (' + address + (device.addressType ? ', ' + device.addressType : '') + ', ' + device.backend + ', ' + paired + rssi + ')';
      }

      function appendDeviceOption(group, device) {
        group.append(
          $('<option></option>')
            .attr('value', deviceValue(device.name, device.address))
            .text(deviceLabel(device))
        );
      }

      function setSelected(mode, name, address) {
        targetMode.val(mode);
        deviceName.val(name || '');
        deviceAddress.val(address || '');
        deviceSelect.val(mode === 'device' ? deviceValue(name, address) : mode === 'none' ? 'none' : '');
      }

      function renderDevices() {
        var currentName = deviceName.val();
        var currentAddress = deviceAddress.val();
        var current = devices.find(function (device) {
          return currentAddress ? (device.address || '').toLowerCase() === currentAddress.toLowerCase() : currentName && device.name === currentName;
        });
        deviceSelect.empty();
        deviceSelect.append($('<option></option>').attr('value', 'none').text('No device selected'));
        deviceSelect.append($('<option></option>').attr('value', '').text('First discovered Truma iNet X'));
        if ((currentName || currentAddress) && !current) {
          var savedGroup = $('<optgroup></optgroup>').attr('label', 'Saved target only — not a Bluetooth record');
          var state = searched ? 'not in search results' : 'not checked';
          savedGroup.append($('<option></option>').attr('value', deviceValue(currentName, currentAddress))
            .text('Saved address: ' + (currentAddress || currentName) + ' (' + state + ')'));
          deviceSelect.append(savedGroup);
        }
        if (devices.length) {
          var foundGroup = $('<optgroup></optgroup>').attr('label', 'Bluetooth records (may include cached devices)');
          devices.forEach(function (device) { appendDeviceOption(foundGroup, device); });
          deviceSelect.append(foundGroup);
        }
        // Keep explicit targets when absent; silently falling back could connect to another panel.
        if (current) { currentName = current.name; currentAddress = current.address; }
        setSelected(targetMode.val() || (currentName || currentAddress ? 'device' : 'first'), currentName, currentAddress);
        if (searched) searchStatus.text(devices.length + ' Bluetooth record' + (devices.length === 1 ? '' : 's') + '; saved target shown separately if absent.');
      }

      deviceSelect.on('change', function () {
        var selected = deviceSelect.val();
        if (selected === 'none') {
          setSelected('none', '', '');
          renderDevices();
          return;
        }
        if (!selected) {
          setSelected('first', '', '');
          renderDevices();
          return;
        }
        try {
          var parsed = JSON.parse(selected);
          setSelected('device', parsed.name, parsed.address);
          renderDevices();
        } catch (error) {
          setSelected('first', '', '');
        }
      });

      searchButton.on('click', function () {
        setBluetoothBusy(true);
        searchStatus.text('searching...');
        $.getJSON('truma-inetx/devices', {
          bluetooth: $('#node-config-input-bluetooth').val(),
          adapter: $('#node-config-input-bluetooth').val() === 'noble' ? '' : $('#node-config-input-adapter').val()
        })
          .done(function (results) {
            devices = results;
            searched = true;
            renderDevices();
          })
          .fail(function (xhr) {
            var response = xhr.responseJSON || {};
            searchStatus.text(response.error || 'search failed');
          })
          .always(function () {
            setBluetoothBusy(false);
          });
      });

      refreshButton.on('click', function () {
        if (!nodeId) {
          refreshStatus.text('deploy first');
          return;
        }
        refreshButton.prop('disabled', true);
        refreshStatus.text('reading...');
        $.ajax({ url: 'truma-inetx/device/' + encodeURIComponent(nodeId) + '/tree', type: 'POST' })
          .done(function (result) {
            refreshStatus.text((result.topics || []).length + ' topics');
          })
          .fail(function (xhr) {
            var response = xhr.responseJSON || {};
            refreshStatus.text(response.error || 'read failed');
          })
          .always(function () {
            refreshButton.prop('disabled', false);
          });
      });

      var adapterInput = $('#node-config-input-adapter');
      var pairButton = $('#node-config-input-pair');
      var forgetButton = $('#node-config-input-forget');
      var bluetoothBusy = false;
      var pairStatus = $('#node-config-input-pair-status');
      var pairingCode = $('#node-config-input-pairingCode');
      $.getJSON('truma-inetx/adapters').done(function (adapters) {
        adapters.forEach(function (adapter) {
          $('#truma-adapters').append($('<option></option>').val(adapter.address || adapter.name).text(adapter.name + (adapter.powered ? '' : ' (powered off)')));
        });
      }).fail(function () { /* Manual MAC or hci input remains available. */ });
      function setBluetoothBusy(busy) {
        bluetoothBusy = busy;
        searchButton.prop('disabled', busy);
        pairButton.add(forgetButton).prop('disabled', busy || $('#node-config-input-bluetooth').val() === 'noble');
        deviceSelect.add(adapterInput).add($('#node-config-input-bluetooth')).prop('disabled', busy);
        if (!busy) adapterInput.prop('disabled', $('#node-config-input-bluetooth').val() === 'noble');
      }
      function backendChanged() {
        var noble = $('#node-config-input-bluetooth').val() === 'noble';
        adapterInput.prop('disabled', noble);
        pairButton.add(forgetButton).prop('disabled', noble || bluetoothBusy);
        pairStatus.text(noble ? 'Editor pairing requires BlueZ on Linux.' : '');
      }
      $('#node-config-input-bluetooth').on('change', backendChanged);
      backendChanged();
      pairButton.on('click', function () {
        if (!deviceAddress.val()) { pairStatus.text('Search and select a device first.'); return; }
        var code = pairingCode.val();
        if (code && !/^\d{6}$/.test(code)) { pairStatus.text('Enter exactly six digits, or leave blank if no code is shown.'); return; }
        setBluetoothBusy(true);
        pairStatus.text('Pairing… confirm on the panel if requested.');
        $.ajax({
          url: 'truma-inetx/pair', type: 'POST', contentType: 'application/json',
          data: JSON.stringify({ adapter: adapterInput.val(), deviceAddress: deviceAddress.val(), passkey: code })
        }).done(function (result) {
          if (result.bluez && result.bluez.paired && result.bluez.address) {
            // BlueZ may resolve a random address to the public identity during pairing.
            var oldAddress = deviceAddress.val().toLowerCase();
            var resolvedAddress = result.bluez.address.toLowerCase();
            devices = devices.filter(function (device) {
              var address = (device.address || '').toLowerCase();
              return address !== oldAddress && address !== resolvedAddress;
            });
            devices.push({ name: result.bluez.name || deviceName.val(), address: result.bluez.address, backend: 'bluez', paired: true });
            setSelected('device', result.bluez.name || deviceName.val(), result.bluez.address);
            renderDevices();
          }
          pairStatus.text(result.bluez && result.bluez.paired ? 'Paired. Deploy, then reread the device tree.' : 'Pairing triggered; check the panel.');
        }).fail(function (xhr) {
          pairStatus.text((xhr.responseJSON || {}).error || 'Pairing failed. Check pairing mode and Bluetooth permissions.');
        }).always(function () {
          pairingCode.val('');
          setBluetoothBusy(false);
        });
      });
      forgetButton.on('click', function () {
        var address = deviceAddress.val();
        var adapter = adapterInput.val().trim();
        if (!adapter || !address) { pairStatus.text('Select a specific adapter and device first.'); return; }
        if (!window.confirm('Forget Bluetooth pairing and cached records for ' + address + ' on adapter ' + adapter + '? This removes the host bond for all flows using this device and clears this editor selection. Update and Deploy to save the cleared selection. You may also need to remove this host on the Truma panel.')) return;
        setBluetoothBusy(true);
        pairStatus.text('Forgetting pairing…');
        $.ajax({
          url: 'truma-inetx/unpair', type: 'POST', contentType: 'application/json',
          data: JSON.stringify({ adapter: adapter, deviceAddress: address })
        }).done(function (result) {
          devices = devices.filter(function (device) { return (device.address || '').toLowerCase() !== address.toLowerCase(); });
          setSelected('none', '', '');
          renderDevices();
          pairStatus.text((result.status === 'not-found' ? 'No stored Bluetooth record found on this adapter.' : 'Host pairing and cached records removed.') + ' Selection cleared. Update and Deploy to save, or Search and select the panel to pair again. A nearby panel can appear again in Search.');
        }).fail(function (xhr) {
          pairStatus.text((xhr.responseJSON || {}).error || 'Could not forget pairing.');
        }).always(function () { setBluetoothBusy(false); });
      });
      renderDevices();
    }
  });
</script>

<script type="text/html" data-template-name="truma-inetx-device">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name">
  </div>
  <div class="form-row">
    <label for="node-config-input-bluetooth"><i class="fa fa-bluetooth"></i> Bluetooth</label>
    <select id="node-config-input-bluetooth">
      <option value="auto">auto</option>
      <option value="bluez">bluez</option>
      <option value="noble">noble</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-adapter">Adapter</label>
    <input type="text" id="node-config-input-adapter" list="truma-adapters" placeholder="Automatic (BlueZ: MAC address or hci0)">
    <datalist id="truma-adapters"></datalist>
  </div>
  <div class="form-row">
    <label>Connection</label>
    <span>Close after every request (including failed reads).</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-timeZone">Timezone</label>
    <input type="text" id="node-config-input-timeZone" placeholder="Host timezone, e.g. Europe/Berlin">
  </div>
  <div class="form-row">
    <label for="node-config-input-deviceSelect"><i class="fa fa-search"></i> Device</label>
    <select id="node-config-input-deviceSelect" style="width:60%;">
      <option value="none">No device selected</option>
      <option value="">First discovered Truma iNet X</option>
    </select>
    <button type="button" id="node-config-input-search" class="red-ui-button" style="margin-left:4px;">Search</button>
    <input type="hidden" id="node-config-input-targetMode">
    <input type="hidden" id="node-config-input-deviceName">
    <input type="hidden" id="node-config-input-deviceAddress">
  </div>
  <div class="form-row">
    <label></label>
    <span id="node-config-input-search-status" style="color:#666;"></span>
  </div>
  <div class="form-row">
    <label for="node-config-input-pairingCode">Pairing code</label>
    <input type="password" id="node-config-input-pairingCode" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Six digits if required" style="width:45%;">
    <button type="button" id="node-config-input-pair" class="red-ui-button">Pair</button>
  </div>
  <div class="form-row"><label></label><button type="button" id="node-config-input-forget" class="red-ui-button">Forget pairing</button></div>
  <div class="form-row"><label></label><span id="node-config-input-pair-status"></span></div>
  <div class="form-row">
    <label><i class="fa fa-sitemap"></i> Device tree</label>
    <button type="button" id="node-config-input-refresh-tree" class="red-ui-button">Reread</button>
    <span id="node-config-input-refresh-tree-status" style="margin-left:8px;color:#666;"></span>
  </div>
</script>

<script type="text/html" data-help-name="truma-inetx-device">
  <p>Deleting a configuration does not remove its Bluetooth bond. Select an explicit adapter and device, then use Forget pairing to remove the host bond and all cached BlueZ records matching that address on that adapter. This affects all flows using that device on this adapter. Remove the host on the panel too if needed. Forget pairing also clears the editor selection; click Update and Deploy to persist that change. No device selected prevents automatic connections. A nearby panel can be discovered again, including under a different random address; forgetting is not a blocklist. Other addresses are not deleted merely because they have the same name. Search can include cached devices; paired on host describes the stored Linux state.</p>
  <p>Configures a Truma iNet X Bluetooth device and caches the discovered topic tree. Use Search to select a visible device. On Linux, put the panel in pairing mode, enter its six-digit code if shown, and click Pair. The code is used once and never saved in the flow. Pair uses the current editor selection; Reread uses the deployed configuration. BlueZ adapter MAC addresses remain stable when hci numbers change. An explicit adapter requires BlueZ (auto selects it). Leave the adapter blank for noble. The timezone controls SystemTime.Lot and defaults to the host timezone. Connections close after each operation.</p>
</script>
