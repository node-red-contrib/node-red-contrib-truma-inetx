<script type="text/javascript">
  function prepareTrumaTimeZone() {
    var input = $('#node-config-input-timeZone');
    var list = $('#truma-timezones');
    var browserButton = $('#node-config-input-browser-timeZone');
    var browserZone = '';
    try { browserZone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (_) { /* Manual input remains available. */ }
    browserButton.prop('disabled', !browserZone).attr('title', browserZone || 'Browser timezone unavailable');
    browserButton.on('click', function () { input.val(browserZone).trigger('change'); });
    $('#node-config-input-auto-timeZone').on('click', function () { input.val('').trigger('change'); });

    function populate(zones) {
      list.empty();
      Array.from(new Set(zones.concat(['UTC', browserZone, input.val().trim()]))).filter(Boolean).sort().forEach(function (zone) {
        list.append($('<option></option>').val(zone));
      });
    }
    $.getJSON('truma-inetx/timezones').done(function (result) {
      populate(result.timeZones);
      input.attr('placeholder', 'Automatic');
    }).fail(function () {
      var zones = [];
      try { if (Intl.supportedValuesOf) zones = Intl.supportedValuesOf('timeZone'); } catch (_) { /* Manual input remains available. */ }
      populate(zones);
    });
  }

  RED.nodes.registerType('truma-inetx-device', {
    category: 'config',
    defaults: {
      name: { value: '' },
      bluetooth: { value: 'auto' },
      adapter: { value: '' },
      connectionMode: { value: 'request' },
      idleTimeoutMinutes: { value: 1, validate: function (value) { return this.connectionMode !== 'idle' || (Number.isFinite(Number(value)) && Number(value) >= 0.1 && Number(value) <= 1440); } },
      timeZone: { value: '', validate: function (value) { try { if (value) new Intl.DateTimeFormat('en', { timeZone: value.trim() }); return true; } catch (_) { return false; } } },
      targetMode: { value: 'none' },
      deviceName: { value: '' },
      deviceAddress: { value: '' }
    },
    label: function () {
      return this.name || this.deviceName || this.deviceAddress || 'Truma iNet X';
    },
    oneditsave: function () {
      if ($('#node-config-input-bluetooth').val() === 'noble') $('#node-config-input-adapter').val('');
      $('#node-config-input-timeZone').val($('#node-config-input-timeZone').val().trim());
    },
    oneditprepare: function () {
      prepareTrumaTimeZone();
      // Existing flows predate these fields and need visible editor defaults.
      $('#node-config-input-connectionMode').val(this.connectionMode === 'idle' ? 'idle' : 'request');
      $('#node-config-input-idleTimeoutMinutes').val(this.idleTimeoutMinutes ?? 1);
      function connectionModeChanged() {
        $('#node-config-input-idle-timeout-row').toggle($('#node-config-input-connectionMode').val() === 'idle');
      }
      $('#node-config-input-connectionMode').on('change', connectionModeChanged);
      connectionModeChanged();
      var nodeId = this.id;
      var deviceSelect = $('#node-config-input-deviceSelect');
      var targetMode = $('#node-config-input-targetMode');
      var deviceName = $('#node-config-input-deviceName');
      var deviceAddress = $('#node-config-input-deviceAddress');
      var searchButton = $('#node-config-input-search');
      var searchStatus = $('#node-config-input-search-status');
      var refreshButton = $('#node-config-input-refresh-tree');
      var refreshStatus = $('#node-config-input-refresh-tree-status');
      var devices = [];
      var searched = false;

      function deviceValue(name, address) {
        return JSON.stringify({ name: name || '', address: address || '' });
      }

      function deviceLabel(device) {
        return device.name || 'Truma iNet X';
      }

      function appendDeviceOption(group, device) {
        group.append(
          $('<option></option>')
            .attr('value', deviceValue(device.name, device.address))
            .text(deviceLabel(device))
        );
      }

      function setSelected(mode, name, address) {
        targetMode.val(mode);
        deviceName.val(name || '');
        deviceAddress.val(address || '');
        deviceSelect.val(mode === 'device' ? deviceValue(name, address) : 'none');
      }

      function renderDevices() {
        var currentName = deviceName.val();
        var currentAddress = deviceAddress.val();
        var current = devices.find(function (device) {
          return currentAddress ? (device.address || '').toLowerCase() === currentAddress.toLowerCase() : currentName && device.name === currentName;
        });
        deviceSelect.empty();
        deviceSelect.append($('<option></option>').attr('value', 'none').text('No device selected'));
        if ((currentName || currentAddress) && !current) {
          appendDeviceOption(deviceSelect, { name: currentName, address: currentAddress });
        }
        devices.forEach(function (device) { appendDeviceOption(deviceSelect, device); });
        // Keep explicit targets when absent; silently falling back could connect to another panel.
        if (current) { currentName = current.name || currentName; currentAddress = current.address; }
        setSelected(currentName || currentAddress ? 'device' : 'none', currentName, currentAddress);
        if (searched) searchStatus.text(devices.length ? 'Select your panel to pair and use it.' : 'No devices found. Put the panel in pairing mode and search again.');
      }

      deviceSelect.on('change', function () {
        var selected = deviceSelect.val();
        if (selected === 'none') {
          setSelected('none', '', '');
          renderDevices();
          return;
        }
        if (!selected) return;
        try {
          pairSelected(JSON.parse(selected));
        } catch (_) {
          renderDevices();
        }
      });

      searchButton.on('click', function () {
        closeForgetList();
        setBluetoothBusy(true);
        searchStatus.text('Searching…');
        $.getJSON('truma-inetx/devices', {
          bluetooth: $('#node-config-input-bluetooth').val(),
          adapter: $('#node-config-input-bluetooth').val() === 'noble' ? '' : $('#node-config-input-adapter').val()
        })
          .done(function (results) {
            devices = results;
            searched = true;
            renderDevices();
          })
          .fail(function (xhr) {
            var response = xhr.responseJSON || {};
            searchStatus.text(response.error || 'search failed');
          })
          .always(function () {
            setBluetoothBusy(false);
          });
      });

      refreshButton.on('click', function () {
        if (!nodeId) {
          refreshStatus.text('deploy first');
          return;
        }
        refreshButton.prop('disabled', true);
        refreshStatus.text('reading...');
        $.ajax({ url: 'truma-inetx/device/' + encodeURIComponent(nodeId) + '/tree', type: 'POST' })
          .done(function (result) {
            refreshStatus.text((result.topics || []).length + ' topic names; use a Get node for values.');
          })
          .fail(function (xhr) {
            var response = xhr.responseJSON || {};
            refreshStatus.text(response.error || 'read failed');
          })
          .always(function () {
            refreshButton.prop('disabled', false);
          });
      });

      var adapterInput = $('#node-config-input-adapter');
      var forgetButton = $('#node-config-input-forget');
      var forgetPanel = $('#node-config-input-forget-panel');
      var forgetSelect = $('#node-config-input-forget-device');
      var forgetConfirm = $('#node-config-input-forget-confirm');
      var forgetAdapter = '';
      var forgetDevices = [];
      var bluetoothBusy = false;
      function closeForgetList() {
        forgetPanel.toggle(false);
        forgetAdapter = '';
        forgetDevices = [];
      }
      closeForgetList();
      $('#node-config-input-forget-cancel').on('click', closeForgetList);
      adapterInput.on('change', closeForgetList);
      forgetSelect.on('change', function () { forgetConfirm.prop('disabled', !forgetSelect.val()); });
      var pairStatus = $('#node-config-input-pair-status');
      var savedAdapter = this.adapter || adapterInput.val() || '';
      function renderAdapters(adapters, failed) {
        adapterInput.empty().append($('<option></option>').attr('value', '').text('Automatic'));
        var selected = savedAdapter;
        var found = !savedAdapter;
        adapters.forEach(function (adapter) {
          var value = adapter.address || adapter.name;
          adapterInput.append($('<option></option>').attr('value', value)
            .text(adapter.name + (adapter.address ? ' (' + adapter.address + ')' : '') + (adapter.powered ? '' : ' — powered off')));
          if ([adapter.address, adapter.name, adapter.path].some(function (key) { return key && key.toLowerCase() === savedAdapter.toLowerCase(); })) {
            selected = value;
            found = true;
          }
        });
        if (!found) adapterInput.append($('<option></option>').attr('value', savedAdapter).text(savedAdapter + ' (unavailable)'));
        adapterInput.val(selected);
        $('#node-config-input-adapter-status').text(failed ? 'Could not load adapters. Reopen this editor to retry.' : '');
      }
      renderAdapters([], false);
      $.getJSON('truma-inetx/adapters').done(function (adapters) { renderAdapters(adapters, false); })
        .fail(function () { renderAdapters([], true); });
      function setBluetoothBusy(busy) {
        bluetoothBusy = busy;
        forgetConfirm.prop('disabled', busy || !forgetSelect.val());
        searchButton.prop('disabled', busy);
        forgetButton.prop('disabled', busy || $('#node-config-input-bluetooth').val() === 'noble');
        deviceSelect.add(adapterInput).add($('#node-config-input-bluetooth')).prop('disabled', busy);
        if (!busy) adapterInput.prop('disabled', $('#node-config-input-bluetooth').val() === 'noble');
      }
      function backendChanged() {
        closeForgetList();
        var noble = $('#node-config-input-bluetooth').val() === 'noble';
        adapterInput.prop('disabled', noble);
        forgetButton.prop('disabled', noble || bluetoothBusy);
        pairStatus.text(noble ? 'Editor pairing requires BlueZ on Linux.' : '');
      }
      $('#node-config-input-bluetooth').on('change', backendChanged);
      backendChanged();
      function pairSelected(selected) {
        closeForgetList();
        if ($('#node-config-input-bluetooth').val() === 'noble') {
          setSelected('device', selected.name, selected.address);
          renderDevices();
          pairStatus.text('Selected. Pair in your computer’s Bluetooth settings before deploying.');
          return;
        }
        if (!selected.address) { renderDevices(); return; }
        setBluetoothBusy(true);
        var saveButton = $('#node-config-dialog-ok');
        var saveWasDisabled = saveButton.prop('disabled');
        saveButton.prop('disabled', true);
        pairStatus.text('Pairing… keep the panel in pairing mode and confirm there if requested.');
        $.ajax({
          url: 'truma-inetx/pair', type: 'POST', contentType: 'application/json',
          data: JSON.stringify({ adapter: adapterInput.val(), deviceAddress: selected.address })
        }).done(function (result) {
          if (result.bluez && result.bluez.paired && result.bluez.address) {
            // BlueZ can resolve a private address to the bonded identity during pairing.
            var oldAddress = selected.address.toLowerCase();
            var resolvedAddress = result.bluez.address.toLowerCase();
            devices = devices.filter(function (device) {
              var address = (device.address || '').toLowerCase();
              return address !== oldAddress && address !== resolvedAddress;
            });
            var name = result.bluez.name || selected.name;
            devices.push({ name: name, address: result.bluez.address, backend: 'bluez', paired: true });
            setSelected('device', name, result.bluez.address);
            pairStatus.text('Paired. Update and Deploy to use this device.');
          } else {
            pairStatus.text('Pairing was not confirmed. Put the panel in pairing mode, then select it again.');
          }
          renderDevices();
        }).fail(function (xhr) {
          // Keep the previous target if pairing the new selection fails.
          renderDevices();
          pairStatus.text((xhr.responseJSON || {}).error || 'Pairing failed. Put the panel in pairing mode, then select it again.');
        }).always(function () {
          setBluetoothBusy(false);
          saveButton.prop('disabled', saveWasDisabled);
        });
      }
      forgetButton.on('click', function () {
        closeForgetList();
        var adapter = adapterInput.val().trim();
        if (!adapter) { pairStatus.text('Select an adapter first to list its saved devices.'); return; }
        setBluetoothBusy(true);
        pairStatus.text('Loading devices…');
        $.getJSON('truma-inetx/devices', { bluetooth: 'bluez', adapter: adapter })
          .done(function (results) {
            forgetAdapter = adapter;
            forgetDevices = results.filter(function (device) { return !!device.address; });
            forgetSelect.empty().append($('<option></option>').attr('value', '').text('Select a device to forget'));
            forgetDevices.forEach(function (device) {
              forgetSelect.append($('<option></option>').attr('value', device.address)
                .text(deviceLabel(device) + ' (' + device.address + ')'));
            });
            forgetSelect.val('');
            forgetPanel.toggle(forgetDevices.length > 0);
            pairStatus.text(forgetDevices.length ? 'Choose the device to forget, then confirm.' : 'No Bluetooth records found on this adapter.');
          }).fail(function (xhr) {
            pairStatus.text((xhr.responseJSON || {}).error || 'Could not load devices.');
          }).always(function () { setBluetoothBusy(false); });
      });
      forgetConfirm.on('click', function () {
        var adapter = forgetAdapter;
        var selected = forgetDevices.find(function (device) { return device.address === forgetSelect.val(); });
        if (bluetoothBusy || !selected || !adapter || adapter !== adapterInput.val()) return;
        var address = selected.address;
        if (!window.confirm('Forget ' + deviceLabel(selected) + ' (' + address + ') on adapter ' + adapter + '? This removes its pairing and cached records for all flows using this device. You may also need to remove this host on the Truma panel.')) return;
        setBluetoothBusy(true);
        pairStatus.text('Forgetting pairing…');
        $.ajax({
          url: 'truma-inetx/unpair', type: 'POST', contentType: 'application/json',
          data: JSON.stringify({ adapter: adapter, deviceAddress: address })
        }).done(function (result) {
          devices = devices.filter(function (device) { return (device.address || '').toLowerCase() !== address.toLowerCase(); });
          var cleared = deviceAddress.val().toLowerCase() === address.toLowerCase();
          if (cleared) setSelected('none', '', '');
          renderDevices();
          closeForgetList();
          pairStatus.text((result.status === 'not-found' ? 'No stored Bluetooth record found.' : 'Pairing and cached records removed.') +
            (cleared ? ' Update and Deploy to save the cleared selection.' : '') + ' A nearby panel can appear in Search again.');
        }).fail(function (xhr) {
          pairStatus.text((xhr.responseJSON || {}).error || 'Could not forget pairing.');
        }).always(function () { setBluetoothBusy(false); });
      });
      renderDevices();
    }
  });
</script>

<script type="text/html" data-template-name="truma-inetx-device">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name">
  </div>
  <div class="form-row">
    <label for="node-config-input-bluetooth"><i class="fa fa-bluetooth"></i> Bluetooth</label>
    <select id="node-config-input-bluetooth" style="width:70%;">
      <option value="auto">auto</option>
      <option value="bluez">bluez</option>
      <option value="noble">noble</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-adapter">Adapter</label>
    <select id="node-config-input-adapter" style="width:70%;"><option value="">Automatic</option></select>
  </div>
  <div class="form-row"><label></label><span id="node-config-input-adapter-status"></span>
  </div>
  <div class="form-row">
    <label for="node-config-input-connectionMode">Connection</label>
    <select id="node-config-input-connectionMode" style="width:70%;">
      <option value="request">Close after every request</option>
      <option value="idle">Keep open until idle timeout (experimental)</option>
    </select>
  </div>
  <div class="form-row" id="node-config-input-idle-timeout-row">
    <label for="node-config-input-idleTimeoutMinutes">Idle timeout</label>
    <input type="number" id="node-config-input-idleTimeoutMinutes" min="0.1" max="1440" step="0.1" style="width:100px;"> minutes
    <p style="margin-left:105px;">Some panels may disconnect earlier. Use close after every request if reads are unreliable.</p>
  </div>
  <div class="form-row">
    <label></label><span>Failures close the connection. Your phone can connect once it closes.</span>
  </div>
  <div class="form-row">
    <label for="node-config-input-timeZone">Timezone</label>
    <input type="text" id="node-config-input-timeZone" list="truma-timezones" placeholder="Automatic" style="width:70%;">
    <datalist id="truma-timezones"></datalist>
  </div>
  <div class="form-row">
    <label></label>
    <button type="button" id="node-config-input-auto-timeZone" class="red-ui-button">Automatic (host)</button>
    <button type="button" id="node-config-input-browser-timeZone" class="red-ui-button">Use browser timezone</button>
  </div>
  <div class="form-row">
    <label for="node-config-input-deviceSelect"><i class="fa fa-search"></i> Device</label>
    <select id="node-config-input-deviceSelect" style="width:70%;">
      <option value="none">No device selected</option>
    </select>
    <input type="hidden" id="node-config-input-targetMode">
    <input type="hidden" id="node-config-input-deviceName">
    <input type="hidden" id="node-config-input-deviceAddress">
  </div>
  <div class="form-row">
    <label></label>
    <span id="node-config-input-search-status" style="color:#666;"></span>
  </div>
  <div class="form-row">
    <p style="margin-left:105px;">Put your panel in Bluetooth pairing mode, then Search and select it to pair.</p>
    <label></label>
    <button type="button" id="node-config-input-search" class="red-ui-button">Search</button>
    <button type="button" id="node-config-input-forget" class="red-ui-button">Forget pairing…</button>
  </div>
  <div id="node-config-input-forget-panel" style="display:none;">
    <div class="form-row">
      <label for="node-config-input-forget-device">Forget device</label>
      <select id="node-config-input-forget-device" style="width:70%;"></select>
    </div>
    <div class="form-row">
      <label></label>
      <button type="button" id="node-config-input-forget-confirm" class="red-ui-button" disabled>Forget selected device</button>
      <button type="button" id="node-config-input-forget-cancel" class="red-ui-button">Cancel</button>
    </div>
  </div>
  <div class="form-row"><label></label><span id="node-config-input-pair-status"></span></div>
  <div class="form-row">
    <label><i class="fa fa-sitemap"></i> Device tree</label>
    <button type="button" id="node-config-input-refresh-tree" class="red-ui-button">Reread</button>
    <span id="node-config-input-refresh-tree-status" style="margin-left:8px;color:#666;"></span>
  </div>
</script>

<script type="text/html" data-help-name="truma-inetx-device">
  <p>Deleting a configuration does not remove its Bluetooth bond. Select an explicit adapter, open Forget pairing, choose a device from its list and confirm to remove the host bond and all cached BlueZ records matching that address on that adapter. This affects all flows using that device on this adapter. Remove the host on the panel too if needed. Forgetting the currently selected device also clears the editor selection; click Update and Deploy to persist that change. No device selected prevents automatic connections. A nearby panel can be discovered again, including under a different random address; forgetting is not a blocklist. Other addresses are not deleted merely because they have the same name. Search can include cached devices. The forget list includes addresses to distinguish devices with the same name.</p>
  <p>Configures a Truma iNet X Bluetooth device and caches the discovered topic tree. Reread refreshes topic names and the device list; Get reads parameter values and learns their groups. On Linux, put the panel in pairing mode, click Search and select it. Selecting a device starts pairing; opening the editor or searching does not. Confirm on the panel if requested. Panels requiring a passkey can still be paired with the CLI. Pairing uses the selected search result; Reread uses the deployed configuration. BlueZ adapter MAC addresses remain stable when hci numbers change. An explicit adapter requires BlueZ (auto selects it). Leave the adapter blank for noble. The timezone controls SystemTime.Lot. Blank or Automatic (host) uses the timezone of the computer running Node-RED. Type to filter timezone suggestions. Use browser timezone copies the current browser timezone as an explicit setting; it does not follow later browser timezone changes or change the host OS timezone. Daylight saving time is calculated for each request. By default connections close after every request. Idle mode keeps the connection for the selected minutes after the last successful request; each request resets the timer. Failed requests, deployment, and Bluetooth operations for another device release the connection. The phone app can connect once the connection closes.</p>
</script>
